name: Source checks

on:
  push:
    branches: [astro-js-production]
  pull_request:
    branches: [source]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run check
